<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prismarity Beacon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 240px;
      background: #0E1118;
      color: #D6DAE6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid #1B2130;
    }
    .header-text { flex: 1; }
    .header-title { font-size: 14px; font-weight: 600; color: #D6DAE6; }
    .header-sub  { font-size: 11px; color: #5C6479; margin-top: 2px; }
    .body { padding: 14px 16px; }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #171B26;
      border: 1px solid #1B2130;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.active { background: #38BDF8; animation: pulse 1.4s ease-in-out infinite; }
    .dot.idle   { background: #5C6479; }
    .status-text { font-size: 12px; color: #8B93A7; }
    .platform-badge {
      margin-left: auto;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .twitch { background: #A66CFF22; color: #A66CFF; border: 1px solid #A66CFF44; }
    .kick   { background: #5BE37D22; color: #5BE37D; border: 1px solid #5BE37D44; }
    .pair {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #1B2130;
    }
    .pair-label { font-size: 11px; font-weight: 600; color: #8B93A7; margin-bottom: 6px; }
    .pair-row { display: flex; gap: 6px; }
    .pair-input {
      flex: 1;
      min-width: 0;
      background: #12161F;
      border: 1px solid #232A38;
      border-radius: 6px;
      padding: 6px 8px;
      color: #D6DAE6;
      font-family: monospace;
      font-size: 11px;
    }
    .pair-input:focus { outline: none; border-color: #38BDF8; }
    .pair-save {
      background: #1F2532;
      border: 1px solid #232A38;
      border-radius: 6px;
      padding: 6px 10px;
      color: #D6DAE6;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .pair-hint { font-size: 10px; color: #5C6479; margin-top: 6px; line-height: 1.5; }
    .footer { padding: 10px 16px 14px; }
    .footer-text { font-size: 10px; color: #5C6479; line-height: 1.6; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="18" r="2.5" fill="#38BDF8"/>
      <path d="M7.5 13.5a6.5 6.5 0 019 0" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <path d="M4 9.5a11 11 0 0116 0" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="header-text">
      <div class="header-title">Prismarity Beacon</div>
      <div class="header-sub">Stream sync companion</div>
    </div>
  </div>

  <div class="body">
    <div class="status-row">
      <div class="dot" id="dot"></div>
      <span class="status-text" id="status-text">Checking…</span>
      <span class="platform-badge" id="platform-badge" style="display:none"></span>
    </div>

    <div class="pair">
      <div class="pair-label">Server URL</div>
      <div class="pair-row">
        <input class="pair-input" id="origin-input" type="text" placeholder="https://your-app.vercel.app" autocomplete="off" spellcheck="false" />
        <button class="pair-save" id="origin-save">Save</button>
      </div>
      <div class="pair-hint" id="origin-hint">Where your Prismarity dashboard is hosted.</div>
    </div>

    <div class="pair">
      <div class="pair-label">Pairing key</div>
      <div class="pair-row">
        <input class="pair-input" id="token-input" type="password" placeholder="Paste from Prismarity settings" autocomplete="off" spellcheck="false" />
        <button class="pair-save" id="token-save">Save</button>
      </div>
      <div class="pair-hint" id="pair-hint">Links this extension to your account.</div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-text">
      Navigate to a Twitch or Kick stream and Prismarity will switch automatically when Beacon Mode is on.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
